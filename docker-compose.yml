version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: receipt_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: juice_pos
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - receipt-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: receipt_backend
    restart: unless-stopped
    environment:
      PORT: 5001
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/juice_pos
      JWT_SECRET: production_docker_compose_super_secure_secret_key_32_chars!
      ALLOWED_ORIGINS: http://localhost,http://localhost:3000,http://localhost:80
    ports:
      - "5001:5001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - receipt-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: receipt_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - receipt-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
    name: receipt_mongo_data

networks:
  receipt-net:
    name: receipt_network
    driver: bridge
